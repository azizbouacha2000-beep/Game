<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة المطاردة الجماعية أونلاين</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; font-family: Tahoma, sans-serif; }
        #ui { position: absolute; top: 20px; right: 20px; color: #fff; text-shadow: 2px 2px 4px #000; z-index: 10; font-size: 20px; }
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #00ffcc; font-size: 35px; font-weight: bold; pointer-events: none; }
        #instructions { position: absolute; bottom: 20px; width: 100%; text-align: center; color: #fff; background: rgba(0,0,0,0.6); padding: 10px; font-size: 16px; }
    </style>
</head>
<body>
    <div id="ui">نقاطي: <span id="score">0</span></div>
    <div id="crosshair">⌖</div>
    <div id="instructions">انقر على الشاشة لإطلاق النار وتدمير الأهداف مع أصدقائك!</div>

    <!-- استدعاء مكتبات Three.js و Socket.io -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let scene, camera, renderer, enemies = [];
        let myScore = 0;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0b132b); // سماء ليلية احترافية

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 2);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            // إضاءة متقدمة
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0x00ffcc, 1.2);
            dirLight.position.set(10, 30, 10);
            scene.add(dirLight);

            // بناء الطريق السريع بستايل مدينة مستقبلية
            createRoadAndEnvironment();

            // إطلاق النار باللمس أو النقر
            window.addEventListener('click', onShoot);
            window.addEventListener('touchstart', (e) => {
                e.preventDefault();
                onShoot();
            }, { passive: false });

            window.addEventListener('resize', onWindowResize);
        }

        function createRoadAndEnvironment() {
            // الشارع
            const roadGeo = new THREE.PlaneGeometry(12, 1200);
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x1c1c1c, roughness: 0.2 });
            const road = new THREE.Mesh(roadGeo, roadMat);
            road.rotation.x = -Math.PI / 2;
            road.position.z = -600;
            scene.add(road);

            // توليد الأعداء بشكل مستمر
            for (let i = 0; i < 25; i++) {
                spawnEnemy(-50 - (i * 25));
            }
        }

        function spawnEnemy(zPos) {
            const group = new THREE.Group();
            
            // مجسم العدو بجودة شكل سيارة أو روبوت مكعب مصمم بدقة
            const bodyGeo = new THREE.BoxGeometry(2, 2, 4);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff0055, metalness: 0.8, roughness: 0.2 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 1;
            group.add(body);

            group.position.x = (Math.random() - 0.5) * 8;
            group.position.y = 0;
            group.position.z = zPos;

            scene.add(group);
            enemies.push(group);
        }

        function onShoot() {
            if (enemies.length > 0) {
                // إصابة أقرب عدو
                const target = enemies[0];
                scene.remove(target);
                enemies.shift();

                // إرسال النقاط للسيرفر
                socket.emit('shootTarget');

                // إعادة إنتاج عدو جديد في الأفق
                spawnEnemy(-400);
            }
        }

        socket.ons('updateScore', (data) => {
            if (data.id === socket.id) {
                document.getElementById('score').innerText = data.score;
            }
        });

        function animate() {
            requestAnimationFrame(animate);

            // تحريك الأعداء للأمام لمحاكاة حركة السيارة
            enemies.forEach(enemy => {
                enemy.position.z += 0.8;
                if (enemy.position.z > 5) {
                    enemy.position.z = -400;
                    enemy.position.x = (Math.random() - 0.5) * 8;
                }
            });

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
